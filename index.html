<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Guard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 0;
        }

        .glass-overlay {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
    </style>
</head>

<body class="overflow-hidden">

    <!-- Map Container -->
    <div id="map"></div>

    <!-- UI Overlay -->
    <div class="fixed top-4 left-4 z-[1000] w-full max-w-sm">
        <div class="glass-overlay rounded-xl p-4 m-2 border border-gray-200">
            <h1
                class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-red-600 to-orange-500 mb-2">
                <i class="fa-solid fa-shield-halved text-red-500 mr-2"></i>Local Guard
            </h1>
            <p class="text-sm text-gray-500 mb-4">Community Safety Network</p>

            <button onclick="toggleReportMode()" id="reportBtn"
                class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-lg transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-bullhorn"></i> Report Incident
            </button>
            <p id="instruction" class="text-xs text-orange-600 mt-2 hidden text-center font-bold animate-pulse">Tap on
                the map to pinpoint location</p>
        </div>

        <!-- Recent Alerts Feed (Simulated) -->
        <div id="alertsFeed" class="glass-overlay rounded-xl p-4 m-2 mt-4 max-h-60 overflow-y-auto hidden md:block">
            <h3 class="text-xs font-bold text-gray-400 uppercase mb-2">Live Feed</h3>
            <div id="feedContent" class="space-y-2">
                <!-- Items injected here -->
            </div>
        </div>
    </div>

    <!-- API Key Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 z-[2000] hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg max-w-sm w-full">
            <h2 class="text-xl font-bold mb-4">Configuration</h2>
            <input type="password" id="apiKeyInput" placeholder="Gemini API Key" class="w-full border p-2 rounded mb-4">
            <button onclick="saveApiKey()" class="w-full bg-blue-600 text-white p-2 rounded">Save</button>
        </div>
    </div>

    <!-- Scale Legend -->
    <div class="fixed bottom-8 right-4 z-[1000] bg-white/90 p-3 rounded-lg shadow-lg text-xs">
        <div class="flex items-center gap-2 mb-1"><span class="w-3 h-3 rounded-full bg-green-500"></span> Low (1-3)
        </div>
        <div class="flex items-center gap-2 mb-1"><span class="w-3 h-3 rounded-full bg-yellow-500"></span> Medium (4-7)
        </div>
        <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></span>
            Critical (8-10)</div>
    </div>

    <script>
        // --- Logic ---
        let map, reportMode = false;
        let selectedLocation = null;
        let tempMarker = null;

        // Init Map
        window.addEventListener('DOMContentLoaded', () => {
            map = L.map('map').setView([40.7128, -74.0060], 13); // Default NYC
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CartoDB'
            }).addTo(map);

            // Get User Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    map.setView([pos.coords.latitude, pos.coords.longitude], 15);
                });
            }

            // Map Click
            map.on('click', (e) => {
                if (reportMode) {
                    selectedLocation = e.latlng;
                    if (tempMarker) map.removeLayer(tempMarker);
                    tempMarker = L.marker(e.latlng).addTo(map).bindPopup("Report Location").openPopup();

                    const desc = prompt("Describe the incident (e.g., 'Large pothole causing traffic', 'Building fire'):");
                    if (desc) processReport(desc, e.latlng);

                    // Reset
                    reportMode = false;
                    document.getElementById('instruction').classList.add('hidden');
                    document.getElementById('reportBtn').classList.remove('bg-gray-500');
                    document.getElementById('reportBtn').classList.add('bg-red-600');
                    document.getElementById('reportBtn').textContent = "Report Incident";
                }
            });

            // Alerts Feed
            // Simulate receiving alerts
            setInterval(() => {
                if (Math.random() > 0.95) addFeedItem("Flooding reported near Main St", "Medium");
            }, 3000);

            // API Key Check
            let key = localStorage.getItem('gemini_api_key');
            if (!key) {
                document.getElementById('settingsModal').classList.remove('hidden');
            }
        });

        function toggleReportMode() {
            reportMode = !reportMode;
            const btn = document.getElementById('reportBtn');
            const instr = document.getElementById('instruction');

            if (reportMode) {
                btn.classList.remove('bg-red-600');
                btn.classList.add('bg-gray-500');
                btn.textContent = "Cancel";
                instr.classList.remove('hidden');
            } else {
                btn.classList.add('bg-red-600');
                btn.classList.remove('bg-gray-500');
                btn.textContent = "Report Incident";
                instr.classList.add('hidden');
                if (tempMarker) map.removeLayer(tempMarker);
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value;
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                document.getElementById('settingsModal').classList.add('hidden');
            }
        }

        async function processReport(description, latlng) {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) return document.getElementById('settingsModal').classList.remove('hidden');

            try {
                // Remove temp marker
                if (tempMarker) map.removeLayer(tempMarker);

                // Add loading indicator
                const loader = L.popup().setLatLng(latlng).setContent("Analyzing severity...").openOn(map);

                // Call Gemini
                const prompt = `Analyze this incident report: "${description}". 
                Rate severity 1-10 (10=disaster). Categorize strictly as: Fire, Medical, Traffic, Weather, or Other. 
                Return strictly valid JSON: {"severity": int, "category": string, "summary": short_string}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                let text = data.candidates[0].content.parts[0].text;
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();

                let result;
                try {
                    result = JSON.parse(text);
                } catch (e) {
                    const match = text.match(/\{.*\}/s);
                    if (match) result = JSON.parse(match[0]);
                    else throw new Error("Invalid JSON from AI");
                }

                // Determine Color
                let color = 'green';
                if (result.severity > 3) color = 'orange';
                if (result.severity > 7) color = 'red';

                // Add Permanent Marker
                const circle = L.circleMarker(latlng, {
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.7,
                    radius: 10 + (result.severity * 2) // Radius based on severity
                }).addTo(map);

                // Popup Content
                const popupContent = `
                    <div class="p-2">
                        <strong class="text-lg">${result.category}</strong>
                        <span class="text-xs bg-gray-200 px-1 rounded ml-2">Sev: ${result.severity}/10</span>
                        <p class="text-sm mt-1 mb-2">${result.summary}</p>
                        <p class="text-xs text-gray-400 italic">Original: "${description}"</p>
                    </div>
                `;
                circle.bindPopup(popupContent).openPopup();

                // Add to Feed
                addFeedItem(result.summary, result.category);

            } catch (e) {
                alert("Analysis failed.");
                console.error(e);
            }
        }

        function addFeedItem(text, type) {
            const feed = document.getElementById('feedContent');
            const item = document.createElement('div');
            item.className = "text-xs p-2 bg-gray-50 rounded border-l-4 border-blue-400";
            item.innerHTML = `<strong>${type}:</strong> ${text}`;
            feed.prepend(item);
            if (feed.children.length > 5) feed.removeChild(feed.lastChild);
        }
    </script>
</body>

</html>
